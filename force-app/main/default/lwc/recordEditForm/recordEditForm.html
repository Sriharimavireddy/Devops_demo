<template>
    <lightning-card title="Record edit form">
        <lightning-record-edit-form
        object-api-name={objectName}
        onsuccess ={SuccessHandler}>

        <lightning-messages> </lightning-messages>


        <lightning-input-field field-name={fields.accountfield}></lightning-input-field>
              <lightning-input-field field-name={fields.namefield}></lightning-input-field>
                <lightning-input-field field-name={fields.titlefield}></lightning-input-field>
                           
                 <label class="slds-p-x_small">Enter your Phone number</label>
                <lightning-input-field variant='label-hidden' field-name={fields.phone}></lightning-input-field>
                <lightning-input-field field-name={fields.email}></lightning-input-field>
                <lightning-input-field field-name={fields.department}></lightning-input-field>
                <lightning-button class="slds-m-around_medium" label="Cancel" onclick={ResetHandler}></lightning-button>
                <lightning-button variant="brand" type="submit" label="save" class="slds-m-around_medium" ></lightning-button>
           

    </lightning-record-edit-form>
    </lightning-card>
    
</template>
